name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        run: |
          version="v$(jq -r .version manifest.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - name: Build plugin archive
        run: |
          mkdir -p dist/crowd-missions
          cp -r __init__.py api.py db.py geo.py plugin.py manifest.json LICENSE README.md public templates dist/crowd-missions/
          find dist -name "__pycache__" -type d -prune -exec rm -rf {} +
          cd dist
          zip -r -X crowd-missions.zip crowd-missions
          sha256sum crowd-missions.zip > crowd-missions.zip.sha256
          cat crowd-missions.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/crowd-missions.zip dist/crowd-missions.zip.sha256 --title "$GITHUB_REF_NAME" --generate-notes
